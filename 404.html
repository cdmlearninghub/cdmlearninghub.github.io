<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found – CDM Learning Hub</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f8f9;--surface:#fff;--fg:#14232b;--muted:#56666f;--line:#d9e1e5;--ink:#0f5466;--flag:#c7791a;--flag-soft:#fbefdc}
@media (prefers-color-scheme:dark){:root{--bg:#0e171b;--surface:#152228;--fg:#e4ecef;--muted:#9aabb3;--line:#273840;--ink:#6cc3d6;--flag:#f0a64a;--flag-soft:#3a2a14}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;padding:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:460px;width:100%;overflow:hidden}
.h{background:var(--ink);color:#fff;padding:12px 18px;font-weight:700;display:flex;justify-content:space-between}
.h span{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:400;font-size:.8rem;opacity:.85;align-self:center}
.b{padding:20px 18px}
.q{border-left:4px solid var(--flag);background:var(--flag-soft);border-radius:8px;padding:10px 12px;margin:0 0 16px;font-size:.95rem}
.q b{font-size:.75rem;letter-spacing:.03em}
h1{font-size:1.35rem;margin:0 0 8px}
p{color:var(--muted);line-height:1.5;margin:0 0 16px}
a.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:8px}
@media (prefers-color-scheme:dark){a.btn{color:#0e171b}}
</style>
</head>
<body>
<main class="card">
  <div class="h">CDM Learning Hub <span>ERROR 404</span></div>
  <div class="b">
    <div class="q"><b>OPEN QUERY</b><br>This page could not be found. Please verify the link and try again.</div>
    <h1>Page not found</h1>
    <p>The link may be old or mistyped. Everything about our courses is on the home page.</p>
    <a class="btn" href="/">Go to the home page</a>
  </div>
</main>
</body>
</html>
